<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <title>Reconnect — myflatpay</title>
  <link rel="icon" href="./icons/app-icon-192.png">
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:calc(24px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom));background:#f7f7f4;color:#111;font:16px/1.6 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.card{width:100%;max-width:420px;border:1px solid #e1e1dc;border-radius:24px;padding:36px;background:#fff}.brand{display:flex;align-items:center;gap:12px;font-size:23px;font-weight:750;letter-spacing:-1px}.brand img{width:44px;height:44px;border-radius:12px}h1{font-size:28px;line-height:1.2;letter-spacing:-1px;margin:34px 0 12px}p{color:#62625d;margin:0 0 24px}button{font:inherit;font-weight:650;min-height:48px;width:100%;border:0;border-radius:12px;background:#111;color:#fff;padding:12px;cursor:pointer}button:focus-visible{outline:3px solid #74a983;outline-offset:3px}small{display:block;margin-top:20px;color:#73736d;font-size:13px}
  </style>
</head>
<body>
  <main class="card">
    <div class="brand"><img src="./icons/app-icon-192.png" alt="">myflatpay</div>
    <h1>Let’s get you connected.</h1>
    <p>Your workspace needs an internet connection to load and save changes. Reconnect to continue where you left off.</p>
    <button type="button" onclick="location.reload()">Try again</button>
    <small>Your saved records remain in your online account.</small>
  </main>
</body>
</html>
